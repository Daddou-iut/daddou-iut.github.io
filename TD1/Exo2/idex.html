<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css">
	<script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"}}
	</script>
</head>
<body>
	<div id="map" style="height: 400px"></div>
	<script type="module">
		import {LeafletMap, TileLayer, Marker, Circle, Polygon, Polyline} from 'leaflet';
        var lat = 0;
	    var lon = 0;
		var acc = 0;
       function afficherPosition() {
            map.setView([lat, lon], 15);
            let my_marker = new Marker([lat, lon]).addTo(map);
            new Circle([lat, lon], {radius: acc}).addTo(map);
            new Polygon([
                [25.7617, -80.1918],
                [32.3078, -64.7505],
                [18.4655, -66.1057]
            ], {color: 'red'}).addTo(map);
            let trait = new Polyline([
                [43.29743, 5.3606],
                [lat, lon]
            ], {color: 'pink', weight: 5, opacity: 1}).addTo(map);
            var dist = map.distance([43.29743, 5.3606], [lat, lon]);
            dist = (dist / 1000).toFixed(2);
            my_marker.bindPopup("Distance : " + dist + " km").openPopup();

        }


		function success(pos) {
			lat = pos.coords.latitude;
			lon = pos.coords.longitude;
			acc = pos.coords.accuracy;
            afficherPosition();
			
		}

		function error(err) {
			console.warn(`ERREUR (${err.code}): ${err.message}`);
		}

		
        const map = new LeafletMap('map').setView([43.7, 7.27], 13);
        new TileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=eed6a6b4-d171-43e4-8215-e5f8490b4245', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://stamen.com/">Stamen Design</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

		new Marker([43.7, 7.27]).addTo(map);

        navigator.geolocation.getCurrentPosition(success, error, {
			enableHighAccuracy: true,
			timeout: 5000,
			maximumAge: 0
		});

	</script>
</body>
</html>
